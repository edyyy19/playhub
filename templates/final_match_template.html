<!-- Final match data template for {{ app_name }}. Rendered with Jinja2 and html2image. -->
<html>

<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #181c20;
            color: #fff;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 600px;
            margin: 0 auto;
            background: #23272b;
            border-radius: 16px;
            box-shadow: 0 2px 16px #0008;
            padding: 32px 24px;
        }

        .title {
            font-size: 2.2em;
            font-weight: bold;
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: 1px;
            color: #b2fa19;
        }

        .teams {
            display: flex;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        .team-col {
            width: 45%;
            background: #181c20;
            border-radius: 10px;
            padding: 16px;
        }

        .team-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 12px;
            color: #ffd700;
            text-align: center;
        }

        .player-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .player-list li {
            padding: 6px 0;
            font-size: 1.05em;
            text-align: center;
        }

        .map-row {
            text-align: center;
            margin-top: 24px;
            font-size: 1.15em;
        }

        .map-label {
            color: #aaa;
        }

        .map-name {
            font-weight: bold;
            color: #b2fa19;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="title">{{ app_name }} | {{ match_id }}</div>
        <div class="teams">
            <div class="team-col">
                <div class="team-title">Counter-Terrorists</div>
                <ul class="player-list">
                    {% for player in ct_team %}
                    <li>{{ player }}</li>
                    {% endfor %}
                </ul>
            </div>
            <div class="team-col">
                <div class="team-title">Terrorists</div>
                <ul class="player-list">
                    {% for player in t_team %}
                    <li>{{ player }}</li>
                    {% endfor %}
                </ul>
            </div>
        </div>
        <div class="map-row">
            <span class="map-label">Map Selected:</span>
            <span class="map-name">{{ map_name }}</span>
        </div>
    </div>
</body>

</html>
